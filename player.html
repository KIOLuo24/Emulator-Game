<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Emulator-Game</title>
    <script src="./coi-serviceworker.js"></script>
    <style>
    body,html{margin:0;padding:0;width:100%;height:100%;background: #000000}
    #game-container {width:100vw;height:100vh;}
    canvas {
        /* 强行使用像素邻近法拉伸，保持像素点绝对锐利 */
        image-rendering: -moz-crisp-edges !important;
        image-rendering: -webkit-optimize-contrast !important;
        image-rendering: pixelated !important;
        image-rendering: crisp-edges !important;
    }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const game = urlParams.get('game');
        let type = urlParams.get('type');

        if (type && type.includes('?')) {
            type = type.split('?')[0];
        }

        window.EJS_DEBUG_XX = false;
        window.EJS_player = '#game';

        // 强行开启 EmulatorJS 全局锐化
        window.EJS_scale = 1;
        window.EJS_sharp = true;

        const coreMap = {
            'ps1': 'pcsx_rearmed',
            'playstation': 'pcsx_rearmed',
            'nes': 'fceumm',
            'snes': 'snes9x',
            'gb': 'gambatte',
            'gbc': 'gambatte',
            'gba': 'mgba',
            'nds': 'melonds',
            'n64': 'mupen64plus_next',
            'genesis': 'genesis_plus_gx',
            'sega': 'genesis_plus_gx',
            'segacd': 'genesis_plus_gx',
            'saturn': 'yabause',
            'neogeopocket': 'mednafen_ngp',
            'neogeopocketcolor': 'mednafen_ngp',
            'neogeo': 'fbneo',
            'arcade': 'fbneo'
        };

        const folderMap = {
            'mame': 'fbneo',
            'ps1': 'playstation',
            'playstation': 'playstation'
        };

        const coreType = type ? type.toLowerCase() : '';
        const mappedCore = coreMap[coreType] || coreType;
        window.EJS_core = mappedCore;

        if (game && type) {
            const folderName = folderMap[coreType] || coreType;
            window.EJS_gameUrl = `./roms/${folderName}/${game}`;
            console.log('Game URL:', window.EJS_gameUrl);
        }

        window.EJS_pathtodata = './ems/data/';
        console.log('Path to data:', window.EJS_pathtodata);

        window.EJS_language = 'en-US';

        // --- 核心路径配置 ---
        window.EJS_settings = {
            "corePath": "./ems/data/cores/",
            "memorySize": 512,
            "frameRate": 70,
            "fastForward": true,
            "slowMotion": false,
            "rewindEnabled": "enabled",
            "cheatsEnabled": false,
            "videoScale": 3,
            "videoSmooth": false,        // 【修改】关闭全局画面平滑
            "videoFilter": "none",
            "internalResolution": 1,
            "initialMemorySize": 256,
            "autoFrameSkip": true,
            "frameSkip": 0
        };

        if (coreType === 'ps1' || coreType === 'playstation') {
            window.EJS_biosUrl = "./bios/scph5502.bin";

            window.EJS_settings = {
                ...window.EJS_settings,
                "pcsx_rearmed_gpu": "gpu_unai",
                "pcsx_rearmed_resolution": 2,
                "pcsx_rearmed_dithering": "disabled",
                "initialMemorySize": 128,
                "pcsx_rearmed_frameskip": 0
            };

            fetch('./bios/scph5502.bin', { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        console.log('scph5502.bin not found, switching to scph5501.bin');
                        window.EJS_biosUrl = "./bios/scph5501.bin";
                    } else {
                        console.log('Using scph5501.bin BIOS');
                    }
                })
                .catch(() => {
                    console.log('Failed to check scph5502.bin, switching to scph5501.bin');
                    window.EJS_biosUrl = "./bios/scph5501.bin";
                });
        }
        else if (coreType === 'gba') {
            window.EJS_biosUrl = "./bios/gba_bios.bin";

            window.EJS_settings = {
                ...window.EJS_settings,
                "mgba_interframe_blending": false,
                "mgba_video_color_correction": "enabled",
                "mgba_lcd_ghosting": "disabled",
                "mgba_fps": 60
            };
        }
        else if (coreType === 'gb' || coreType === 'gbc') {
            window.EJS_biosUrl = "./bios/gbc_bios.bin";

            window.EJS_settings = {
                ...window.EJS_settings,
                "gambatte_gb_internal_palette": "optimized",
                "gambatte_mix_frames": "disabled"
            };
        }
        else if (coreType === 'segacd') {
            window.EJS_biosUrl = "./bios/bios_CD_U.bin";
        }
        else if (coreType === 'saturn') {
            window.EJS_biosUrl = "./bios/saturn_bios.bin";
        }
        else if (coreType === 'nds') {
            window.EJS_biosUrl = "./bios/bios7.bin";

            window.EJS_settings = {
                ...window.EJS_settings,
                "initialMemorySize": 128,
                "melonds_fps": 60
            };

            fetch('./bios/bios7.bin', { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        window.EJS_biosUrl = "./bios/bios9.bin";
                        return fetch('./bios/bios9.bin', { method: 'HEAD' });
                    }
                })
                .then(response => {
                    if (response && !response.ok) {
                        window.EJS_biosUrl = "./bios/firmware.bin";
                    }
                });
        }
        else if (coreType === 'neogeopocket' || coreType === 'neogeopocketcolor') {
            window.EJS_biosUrl = "./bios/Neo-Geo_Pocket_Color.bin";

            fetch('./bios/Neo-Geo_Pocket_Color.bin', { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) {
                        console.log('Neo-Geo_Pocket_Color.bin not found, switching to Neo-Geo_Pocket.bin');
                        window.EJS_biosUrl = "./bios/Neo-Geo_Pocket.bin";
                    } else {
                        console.log('Using Neo-Geo_Pocket_Color.bin BIOS');
                    }
                })
                .catch(() => {
                    console.log('Failed to check Neo-Geo_Pocket_Color.bin, switching to Neo-Geo_Pocket.bin');
                    window.EJS_biosUrl = "./bios/Neo-Geo_Pocket.bin";
                });
        }

        if (coreType === 'mame' || coreType === 'fbneo' || coreType === 'arcade' || coreType === 'neogeo') {
            window.EJS_settings = {
                ...window.EJS_settings,
                "webgl2Enabled": "enabled",
                "videoScale": 3,
                "videoSmooth": false,         // 【修改】关闭 Arcade 模式的画面平滑
                "fbneo-neogeo-mode": "UNIBIOS",
                "fbneo-cpu-speed-adjust": 100,
                "fbneo-frameskip": 0,          // 【建议】帧率为 0 或不跳帧，画面更流畅
                "fbneo-interpolation": 0,
                "shader": "sharp"              // 【修改】放弃 sabr，强制使用 sharp 滤镜（纯像素锐化）
            };

            window.EJS_biosUrl = "./bios/neogeo.zip";
            console.log("NeoGeo/Arcade mode: Using neogeo.zip BIOS from", window.EJS_biosUrl);

            if (game && game.includes('mslug6')) {
                window.EJS_biosUrl = "./bios/awbios.zip";
                console.log("MSlug6 detected: Using awbios.zip BIOS");
            }
        }

        // ========== 通用 shader 加载器：从本地相对路径注册，所有核心/游戏通用 ==========
        const SHADER_BASE = "./ems/data/glsl-shaders-master/";
        window.EJS_shaders = {};

        function resolvePath(dir, ref) {
            const out = [];
            for (const p of (dir + ref).split("/")) {
                if (p === "." || p === "") continue;
                if (p === "..") out.pop();
                else out.push(p);
            }
            return out.join("/");
        }

        async function fetchText(path) {
            const res = await fetch(path);
            if (!res.ok) throw new Error("Shader 文件加载失败: " + path);
            return await res.text();
        }

        // 从 .glslp 预设注册 shader（支持 #reference 嵌套、多通道）
        async function registerShaderFromPreset(displayName, presetRelPath) {
            try {
                let url = SHADER_BASE + presetRelPath;
                let text = await fetchText(url);
                let guard = 0;
                // 跟随 #reference 嵌套预设
                while (text.trim().startsWith("#reference") && guard++ < 5) {
                    const ref = text.trim().split(/\s+/).pop().replace(/["']/g, "");
                    url = resolvePath(url.substring(0, url.lastIndexOf("/") + 1), ref);
                    text = await fetchText(url);
                }
                const dir = url.substring(0, url.lastIndexOf("/") + 1);
                const lines = text.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
                const newLines = [];
                const resources = [];
                for (const line of lines) {
                    const m = line.match(/^(shader\d+)\s*=\s*(.+)$/);
                    if (m) {
                        // 抓取通道 .glsl 文件，展平为同名资源
                        const ref = m[2].replace(/^"|"$/g, "").trim();
                        const content = await fetchText(resolvePath(dir, ref));
                        const fileName = ref.split("/").pop();
                        resources.push({ name: fileName, type: "text", value: content });
                        newLines.push(m[1] + ' = "' + fileName + '"');
                    } else {
                        newLines.push(line);
                    }
                }
                window.EJS_shaders[displayName] = {
                    shader: { type: "text", value: newLines.join("\n") },
                    resources: resources
                };
                console.log("Shader 已注册:", displayName);
            } catch (e) {
                console.warn("注册失败:", displayName, e);
            }
        }

        // 注册需要的 shader（可自行增删，路径相对 glsl-shaders-master）
        async function initShaders() {
            await Promise.all([
                registerShaderFromPreset("xbrz-freescale", "xbrz/xbrz-freescale.glslp"),
                registerShaderFromPreset("2xScaleHQ", "scalehq/2xScaleHQ.glslp"),
                registerShaderFromPreset("crt-geom", "crt/crt-geom.glslp"),
                registerShaderFromPreset("sharp-bilinear", "interpolation/sharp-bilinear.glslp")
            ]);
        }
        // ========== shader 加载器结束 ==========

        window.EJS_onGameStart = () => {
            const fixCanvasBuffer = () => {
                const c = document.querySelector('canvas.ejs_canvas');
                if (!c) return;
                window.dispatchEvent(new Event('resize'));
                setTimeout(() => {
                    if (c.width < 600) {
                        const r = c.getBoundingClientRect();
                        c.width = Math.round(r.width);
                        c.height = Math.round(r.height);
                    }
                }, 500);
            };
            setTimeout(fixCanvasBuffer, 1000);
            setTimeout(fixCanvasBuffer, 3000);
            window.addEventListener('resize', () => setTimeout(fixCanvasBuffer, 300));
        };
    </script>
    <script>
        // 先完成 shader 注册，再加载模拟器（保证 loader.js 读取到 EJS_shaders）
        initShaders().then(() => {
            const s = document.createElement("script");
            s.src = "./ems/data/loader.js";
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
